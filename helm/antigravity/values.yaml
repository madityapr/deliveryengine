replicaCount: 2

image:
  repository: antigravity/engine
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  hosts:
    - host: antigravity.internal.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  ANTIGRAVITY_ENV: prod
  EVT_DEFAULT_DEPLOYS_PER_DAY: "3"
  EVT_DEFAULT_LEAD_TIME_HOURS: "4"

timescaledb:
  enabled: true
  persistence:
    size: 20Gi

redis:
  enabled: true
