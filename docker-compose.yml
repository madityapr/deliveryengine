version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: antigravity-timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antigravity}
      POSTGRES_USER: ${POSTGRES_USER:-antigravity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antigravity}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: antigravity-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-api
    command: uvicorn antigravity.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ANTIGRAVITY_ENV=dev
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=antigravity
      - POSTGRES_USER=antigravity
      - POSTGRES_PASSWORD=change-me
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-worker
    command: python -m antigravity.cli.main engine run
    environment:
      - ANTIGRAVITY_ENV=dev
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=antigravity
      - POSTGRES_USER=antigravity
      - POSTGRES_PASSWORD=change-me
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  grafana:
    image: grafana/grafana:latest
    container_name: antigravity-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./dashboard/provisioning:/etc/grafana/provisioning
    depends_on:
      - api

volumes:
  timescaledb_data:
