[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity"
version = "0.1.0"
description = "A friction-elimination and delivery-velocity optimization engine for software engineering systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Antigravity Contributors", email = "maintainers@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
timescale = [
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
]

[project.scripts]
antigravity = "antigravity.cli.main:app"

[project.entry-points."antigravity.sensors"]
mock = "antigravity.sensors.mock:MockSensor"
github = "antigravity.sensors.github:GitHubSensor"

[project.entry-points."antigravity.thrusters"]
test_quarantine = "antigravity.thrust_engine.thrusters.test_quarantine:TestQuarantineThruster"
cache_warmer = "antigravity.thrust_engine.thrusters.cache_warmer:CacheWarmerThruster"
review_router = "antigravity.thrust_engine.thrusters.review_router:ReviewRouterThruster"

[tool.setuptools.packages.find]
include = ["antigravity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
